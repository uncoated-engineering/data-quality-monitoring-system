[project]
name = "data-quality-monitoring-system"
version = "1.0.0"
description = "Automated data quality monitoring with alerting and visualization"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pandas==2.2.0",
    "numpy==1.26.3",
    "pydantic==2.5.3",
    "sqlalchemy==2.0.25",
    "python-multipart==0.0.6",
    "python-dateutil==2.8.2",
    "fuzzywuzzy==0.18.0",
    "python-Levenshtein==0.23.0",
    "scipy==1.12.0",
    "scikit-learn==1.4.0",
    "pydantic-settings==2.1.0",
    "python-jose==3.3.0",
    "passlib==1.7.4",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
]
